name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the migrations that would be applied, without applying them"
        type: boolean
        default: true

# Never run two migration pushes against the same database at once.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    # Self-hosted: the database is only reachable from inside the network.
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set — cannot reach the self-hosted Supabase database."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — no migrations will be applied."
            supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          else
            supabase db push --db-url "$SUPABASE_DB_URL" --yes
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Null on push events, so scheduled pushes always apply for real.
          DRY_RUN: ${{ inputs.dry_run || false }}
